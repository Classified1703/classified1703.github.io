kground:linear-gradient(#0006,#0008),url('https://images.unsplash.com/photo-1618220179428-22790b461013?auto=format&fit=crop&w=1400&q=75') center/cover}.spot{position:absolute;width:34px;height:34px;border-radius:50%;border:3px solid #ff3542;background:#5d080dcc;box-shadow:0 0 0 7px #ff334433}.found{background:#14381d;border-color:#61dd78}.evi{min-height:160px;display:grid;place-items:center;font-weight:900;font-size:28px;background:repeating-linear-gradient(45deg,#151b21,#151b21 12px,#11161b 12px,#11161b 24px)}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.labBox{padding:16px;border:1px solid #2a333d;background:#0e1419;border-radius:12px}.result{margin-top:12px;padding:12px;border-radius:8px;background:#141a20}.good{border-left:4px solid #45ce6d}.bad{border-left:4px solid #f04450}.video{width:100%;background:#000;border-radius:8px}.mono{font-family:ui-monospace,monospace;background:#080b0e;padding:12px;border-radius:8px}.board{display:grid;grid-template-columns:1fr 1fr;gap:14px}.link{padding:12px;border:1px solid #303943;border-radius:8px;margin:8px 0;background:#12181e}.link.sel{outline:2px solid #e6333f}.checks label{display:block;padding:7px 0}.journal{max-height:260px;overflow:auto;font-family:ui-monospace,monospace;font-size:12px}.modal{position:fixed;inset:0;background:#000d;z-index:99;display:grid;place-items:center;padding:18px}.modalBox{width:min(720px,100%);background:#11171d;border:1px solid #39424b;border-radius:12px;padding:20px}@media(max-width:800px){.g4,.g3,.g2,.board{grid-template-columns:1fr 1fr}.scene{min-height:420px}}@media(max-width:520px){.g4,.g3,.g2,.board{grid-template-columns:1fr}.wrap{padding:12px}.top{align-items:flex-start;flex-direction:column}.scene{min-height:360px}.h1{font-size:42px}}</style></head><body><div id="app" class="app"></div><script>const S={started:false,sec:'dossier',found:{phone:1,cctv1:1,cctv2:1},journal:[],cmp:0,neg:0,dna:false,phone:false,board:{},sel:null,final:null};const people={alex:{n:'Алекс Картер',a:'29 лет · 180 см',j:'Бывший сотрудник магазина',al:'Утверждает, что ночью находился дома.',img:'https://randomuser.me/api/portraits/men/32.jpg'},michael:{n:'Майкл Рид',a:'32 года · 182 см',j:'Знакомый владельца',al:'Утверждает, что находился в баре.',img:'https://randomuser.me/api/portraits/men/46.jpg'},daniel:{n:'Дэниел Брукс',a:'35 лет · 185 см',j:'Автомеханик',al:'Утверждает, что ночью находился в мастерской.',img:'https://randomuser.me/api/portraits/men/11.jpg'},sarah:{n:'Сара Миллер',a:'27 лет · 167 см',j:'Бывшая сотрудница охраны',al:'Утверждает, что находилась у друзей.',img:'https://randomuser.me/api/portraits/women/44.jpg'}};const ev={fp:['FP-01','Отпечаток с витрины'],dna:['DNA-01','Кровь с осколка'],fa:['FA-01','Гильза'],fw:['FW-01','След обуви'],door:['DOOR-01','Служебная дверь'],glass:['GLASS-01','Разбитая витрина'],phone:['PHONE-01','Смартфон'],vehicle:['VEH-01','Автомобиль'],cctv1:['CCTV-03','Subject 01–02'],cctv2:['CCTV-07','Парковка']};function log(x){S.journal.unshift(new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})+' — '+x);sessionStorage.fi=JSON.stringify(S)}function restore(){try{Object.assign(S,JSON.parse(sessionStorage.fi||'{}'))}catch{}}restore();const NAV=[['dossier','ДОСЬЕ'],['scene','МЕСТО'],['evidence','УЛИКИ'],['lab','ЛАБОРАТОРИЯ'],['cctv','CCTV'],['digital','ЦИФРОВАЯ'],['board','ДОСКА'],['final','ФИНАЛ']];function shell(x){return `<div class=top><div><div class=brand>FORENSIC <b>INVESTIGATION</b></div><div class=case>ДЕЛО №24-1932 · ОГРАБЛЕНИЕ ЮВЕЛИРНОГО МАГАЗИНА</div></div><button class=btn onclick=journal()>ЖУРНАЛ (${S.journal.length})</button></div><div class=nav>${NAV.map(([k,t])=>`<button class=${S.sec==k?'on':''} onclick="go('${k}')">${t}</button>`).join('')}</div><div class=wrap>${x}</div>`}function go(k){S.sec=k;sessionStorage.fi=JSON.stringify(S);render()}function render(){if(!S.started){app.innerHTML=`<div class=hero><div class=heroBox><div class=ey>FORENSIC INVESTIGATION</div><div class=h1>ДЕЛО №24-1932<br>«Ограбление ювелирного магазина»</div><p>10 октября в 02:17 неизвестные проникли в ювелирный магазин. Часть системы видеонаблюдения была отключена. Из магазина похищены драгоценности. На месте обнаружены биологические и материальные следы.</p><p class=muted>У следствия есть четыре подозреваемых. Самостоятельно исследуйте материалы и сформулируйте версию.</p><button class='btn red' onclick='S.started=true;log("Дело принято к расследованию");render()'>ПРИНЯТЬ ДЕЛО</button></div></div>`;return}app.innerHTML=shell(({dossier,scene,evidence,lab,cctv,digital,board,final}[S.sec])())}function dossier(){return `<div class=ey>CASE FILE / SUSPECTS</div><h1 class=sectionTitle>Досье</h1><div class='grid g4'>${Object.entries(people).map(([k,p])=>`<div class=card><img class=portrait src='${p.img}'><div class=bd><span class=tag>${k.toUpperCase()}</span><h3>${p.n}</h3><div>${p.a}</div><p class=muted>${p.j}</p><p>${p.al}</p><details><summary>ОБРАЗЦЫ ДЛЯ СРАВНЕНИЯ</summary><p class=muted>Контрольный отпечаток · ДНК · обувь</p></details></div></div>`).join('')}</div>`}function scene(){const sp=[['glass',24,38],['fp',39,44],['dna',47,58],['fa',63,66],['fw',76,74],['door',88,38]];return `<div class=ey>CRIME SCENE / SCENE 01</div><h1 class=sectionTitle>Место преступления</h1><div class=scene>${sp.map(([k,x,y])=>`<button class='spot ${S.found[k]?'found':''}' style='left:${x}%;top:${y}%' onclick="discover('${k}')"></button>`).join('')}</div><p class=muted>Нажимайте на активные точки. Система фиксирует находку, но не связывает её с подозреваемым.</p>`}function discover(k){if(!S.found[k]){S.found[k]=1;log(ev[k][0]+' обнаружена');alert('ОБНАРУЖЕНА НОВАЯ УЛИКА — '+ev[k][0])}render()}function evidence(){return `<div class=ey>EVIDENCE LOCKER</div><h1 class=sectionTitle>Улики</h1><div class='grid g3'>${Object.keys(S.found).filter(k=>S.found[k]).map(k=>`<div class=card><div class=evi>${ev[k][0]}</div><div class=bd><h3>${ev[k][1]}</h3>${['fp','dna','fa','fw'].includes(k)?`<button class=btn onclick="S.labItem='${k}';go('lab')">В ЛАБОРАТОРИЮ</button>`:''}</div></div>`).join('')}</div>`}function opts(){return Object.entries(people).map(([k,p])=>`<option value=${k}>${p.n}</option>`).join('')}function lab(){let k=S.labItem||'fp';if(!S.found[k])k=Object.keys(S.found).find(x=>['fp','dna','fa','fw'].includes(x))||'fp';if(k==='dna'&&!S.dna)return `<div class=ey>DNA ANALYSIS</div><h1 class=sectionTitle>DNA-01</h1><div class=labBox><p>Перед сравнением необходимо получить STR-профиль.</p><button class='btn red' onclick='S.dna=true;log("DNA-01 — PROFILE GENERATED");render()'>ВЫДЕЛИТЬ ДНК</button></div>`;const map={fp:['FP-01','michael','POTENTIAL MATCH','NO MATCH'],dna:['DNA-01','michael','PROFILE CONSISTENT','EXCLUDED'],fa:['FA-01','daniel','CONSISTENT','INCONCLUSIVE'],fw:['FW-01','daniel','PATTERN CONSISTENT','NO MATCH']};const m=map[k];return `<div class=ey>FORENSIC LABORATORY</div><h1 class=sectionTitle>${m[0]}</h1><div class=labBox><div class=row>${Object.keys(map).map(x=>`<button class=btn onclick="S.labItem='${x}';render()" ${!S.found[x]?'disabled':''}>${x.toUpperCase()}</button>`).join('')}</div><p>Выберите контрольный образец для сравнения.</p><select id=who class=btn>${opts()}</select> <button class='btn red' onclick="compare('${k}')">ЗАПУСТИТЬ СРАВНЕНИЕ</button><div id=res></div></div>`}function compare(k){const m={fp:['michael','POTENTIAL MATCH','NO MATCH'],dna:['michael','PROFILE CONSISTENT','EXCLUDED'],fa:['daniel','CONSISTENT','INCONCLUSIVE'],fw:['daniel','PATTERN CONSISTENT','NO MATCH']}[k],w=who.value,ok=w===m[0];S.cmp++;if(!ok)S.neg++;log(ev[k][0]+' compared with '+people[w].n+' — '+(ok?m[1]:m[2]));res.innerHTML=`<div class='result ${ok?'good':'bad'}'><b>${ok?m[1]:m[2]}</b><p>${ok?'Обнаружено соответствие исследуемых признаков контрольному образцу. Результат должен оцениваться вместе с другими материалами дела.':'Выбранный образец не подтверждает соответствие. Система не подсказывает, кого проверять дальше.'}</p></div>`}const vid='AAAAIGZ0eXBpc29 (){const src='data:video/mp4;base64,'+vid;return `<div class=ey>VIDEO EXAMINATION</div><h1 class=sectionTitle>CCTV</h1><div class='grid g2'><div class=card><div class=bd><h3>CAM 03 · 02:11:42</h3><video class=video controls playsinline src='${src}'></video><p class=muted>SUBJECT 01 и SUBJECT 02. Лицо ненадёжно для идентификации.</p></div></div><div class=card><div class=bd><h3>CAM 07 · 02:19:26</h3><video class=video controls playsinline src='${src}'></video><p class=muted>Парковка. Частичный номер: 7K — 3?1</p><button class=btn onclick='S.found.vehicle=1;log("Кадр CAM 07 сохранён как VEH-01");alert("Кадр сохранён как улика")'>СОХРАНИТЬ КАДР</button></div></div></div><div class=labBox style='margin-top:14px'><h3>Добавить собственную версию</h3><div class=row><select id=s1 class=btn><option>SUBJECT 01</option>${opts()}</select><select id=s2 class=btn><option>SUBJECT 02</option>${opts()}</select><button class='btn red' onclick='log("CCTV hypothesis saved");alert("Версия сохранена без проверки правильности")'>СОХРАНИТЬ ВЕРСИЮ</button></div></div>`}function digital(){return `<div class=ey>DIGITAL FORENSICS</div><h1 class=sectionTitle>Смартфон</h1><div class=labBox><div class=row><button class=btn onclick='alert("Устройство было активно около 02:08")'>ИНФОРМАЦИЯ</button><button class=btn onclick='alert("Устройство фиксировалось в районе магазина")'>МЕТАДАННЫЕ</button><button class=btn onclick='alert("Активные сообщения не дают прямого вывода")'>СООБЩЕНИЯ</button><button class='btn red' onclick='S.phone=true;log("PHONE-01 — удалённые данные восстановлены");render()'>УДАЛЕННЫЕ ДАННЫЕ</button></div>${S.phone?`<div class='result good mono'>Вымышленный материал учебного дела<br><br>Michael — 02:05<br>«Всё готово?»<br><br>Daniel — 02:06<br>«Да. Жду с другой стороны».<br><br>Michael — 02:06<br>«После сигнала заходим».</div>`:''}</div>`}function board(){const e=['fp','dna','fa','fw','cctv1','cctv2','phone','vehicle'].filter(k=>S.found[k]);return `<div class=ey>INVESTIGATION BOARD</div><h1 class=sectionTitle>Доска расследования</h1><p class=muted>Нажмите на улику, затем на подозреваемого. Связи можно менять, система не исправляет их автоматически.</p><div class=board><div>${Object.entries(people).map(([k,p])=>`<div class=link onclick="link('${k}')"><b>${p.n}</b></div>`).join('')}</div><div>${e.map(k=>`<div class='link ${S.sel==k?'sel':''}' onclick="S.sel='${k}';render()"><b>${ev[k][0]}</b><div class=muted>Связь: ${S.board[k]?people[S.board[k]].n:'не установлена'}</div></div>`).join('')}</div></div>`}function link(p){if(!S.sel)return alert('Сначала выберите улику');S.board[S.sel]=p;log(ev[S.sel][0]+' → '+people[p].n);S.sel=null;render()}function final(){return `<div class=ey>FINAL ASSESSMENT</div><h1 class=sectionTitle>Финальная версия</h1><div class=labBox><h3>Кто, по вашему мнению, причастен?</h3><div class=checks id=pp>${Object.entries(people).map(([k,p])=>`<label><input type=checkbox value=${k}> ${p.n}</label>`).join('')}<label><input type=checkbox value=none> Доказательств недостаточно</label></div><h3>Какие доказательства поддерживают версию?</h3><div class=checks id=pf>${[['cctv','CCTV'],['fp','отпечаток'],['dna','ДНК'],['fa','баллистика'],['fw','обувь'],['phone','смартфон'],['vehicle','автомобиль']].map(([k,t])=>`<label><input type=checkbox value=${k}> ${t}</label>`).join('')}</div><button class='btn red' onclick=finish()>ЗАФИКСИРОВАТЬ ВЕРСИЮ</button></div>`}function finish(){const p=[...pp.querySelectorAll('input:checked')].map(x=>x.value);S.final=p;const good=p.includes('michael')&&p.includes('daniel')&&!p.includes('alex')&&!p.includes('sarah');document.body.insertAdjacentHTML('beforeend',`<div class=modal><div class=modalBox><div class=ey>РАЗБОР</div><h2>Наиболее обоснованная учебная версия</h2><p>Собранные материалы наиболее полно поддерживают версию о возможной совместной причастности <b>Майкла Рида</b> и <b>Дэниела Брукса</b>.</p><p>Майкл: FP-01 ✓ · DNA-01 ✓ · Digital Evidence ✓ · CCTV поддерживает версию.</p><p>Дэниел: FA-01 ✓ · FW-01 ✓ · Digital Evidence ✓ · Vehicle/CCTV ✓.</p><p><b>${good?'Ваш состав версии совпал с учебной версией.':'Ваш состав версии отличается от учебной версии.'}</b></p><p>Лабораторных сравнений: ${S.cmp}. Отрицательных: ${S.neg}.</p><button class='btn red' onclick=trap()>ПРОДОЛЖИТЬ</button></div></div>`)}function trap(){document.querySelector('.modal').remove();document.body.insertAdjacentHTML('beforeend',`<div class=modal><div class=modalBox><h2>Какое доказательство само по себе полностью доказывает юридическую виновность?</h2>${['ДНК','Отпечаток','CCTV','Баллистика','Цифровые данные','НИ ОДНО'].map((x,i)=>`<button class=btn style='margin:5px' onclick="${i==5?'closed()':'alert(\'Неверно. Отдельное криминалистическое доказательство не решает вопрос виновности само по себе.\')'}">${x}</button>`).join('')}</div></div>`)}function closed(){document.querySelector('.modal').innerHTML=`<div class=modalBox><div class=ey>CASE CLOSED</div><h1>YOU COMPLETED THE FORENSIC INVESTIGATION</h1><p>Fingerprint Examination · DNA Analysis · Firearms Examination · Footwear Examination · Digital Forensics · Video Examination</p><button class='btn red' onclick='sessionStorage.removeItem("fi");location.reload()'>ПРОЙТИ ЗАНОВО</button></div>`}function journal(){document.body.insertAdjacentHTML('beforeend',`<div class=modal onclick='this.remove()'><div class=modalBox onclick='event.stopPropagation()'><h2>ЖУРНАЛ РАССЛЕДОВАНИЯ</h2><div class=journal>${S.journal.map(x=>`<div>${x}</div>`).join('')||'Пока нет записей'}</div><button class=btn onclick='this.closest(".modal").remove()'>ЗАКРЫТЬ</button></div></div>`)}render();</script></body></html>
